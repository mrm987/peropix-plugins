# index.json 을 고치는 PR 을 검사한다 — 항목 모양과, 그 태그에 plugin.json 이 있고 id 가 맞는지.
# 코드는 보지 않는다 (README 첫머리의 세 원칙). 검사 내용은 scripts/check.mjs 하나다.
name: Check index

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "index.json"
  push:
    branches: [main]
    paths:
      - "index.json"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check.mjs
